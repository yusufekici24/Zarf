[package]
name = "lynora"
version = "1.7.5"
description = "Debian tabanlı dağıtımlar için e-posta, takvim, kişiler, görevler ve notlar uygulaması"
authors = ["Lynora Geliştiricileri"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lynora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Masaüstü bildirimi: sistemin libdbus'ı ile (zbus/zvariant gerekmez)
notify-rust = { version = "4", default-features = false, features = ["d"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions", "trace"] }
imap = { version = "3.0.0-alpha.15", default-features = false }
imap-proto = "0.16"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
mail-parser = "0.9"
mail-builder = "0.3"
cfb = "0.10"
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# Parolalar: sistem anahtarlığı (Secret Service: GNOME Anahtarlığı / KWallet), yoksa AES-256-GCM
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
getrandom = "0.2"
base64 = "0.22"
encoding_rs = "0.8"
regex = "1"
libloading = "0.8"
quick-xml = "0.42"
md4 = "0.10"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
# HTML ileti gövdesini izin listesiyle temizleme
ammonia = "4"
# Sıkıştırma öncesi boş disk alanı (statvfs)
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# İleti gövdesindeki bağlantının adresi (fare altındaki öğe) için WebKitGTK
webkit2gtk = "2.0"
gtk = "0.18"
# Pencerenin başka pencerelerin arkasında kalıp kalmadığı (yeni posta uyarısı için)
gdkx11 = "0.18"
x11-dl = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
